<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মনোনয়ন দিন - Discover Good People of Bangladesh</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 600px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { color: #006a4e; text-align: center; margin-bottom: 20px; }
    label { font-weight: bold; font-size: 14px; color: #444; }
    input, textarea { width: 100%; padding: 12px; margin: 8px 0 18px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    button { background: #006a4e; color: white; border: none; padding: 14px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
    button:hover { background: #004d38; }
    .back-btn { display: inline-block; margin-bottom: 15px; color: #006a4e; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-btn">← ড্যাশবোর্ডে ফিরে যান</a>
    <h2>একজন ভালো মানুষকে মনোনয়ন দিন</h2>
    
    <form id="nominationForm">
      <label>মনোনীত ব্যক্তির নাম:</label>
      <input type="text" id="name" placeholder="নাম লিখুন" required>

      <label>ক্যাটাগরি/পেশা:</label>
      <input type="text" id="category" placeholder="যেমন: শিক্ষা, স্বাস্থ্য, সমাজসেবা" required>

      <label>জেলা:</label>
      <input type="text" id="district" placeholder="জেলার নাম" required>

      <label>ভালো কাজের বিবরণ:</label>
      <textarea id="description" rows="4" placeholder="তার উদ্যোগ ও কাজের বিবরণ লিখুন" required></textarea>

      <label>আপনার নাম (মনোনয়নকারী):</label>
      <input type="text" id="nominator_name" placeholder="আপনার নাম" required>

      <button type="submit" id="submitBtn">জমা দিন</button>
    </form>
  </div>

  <script>
    // আপনার Google Apps Script-এর Web App URL
    const SCRIPT_URL = "https://script.google.com/macros/s/YOUR_EXEC_ID/exec";

    document.getElementById('nominationForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      btn.innerText = "জমা হচ্ছে...";
      btn.disabled = true;

      const formData = {
        name: document.getElementById('name').value,
        category: document.getElementById('category').value,
        district: document.getElementById('district').value,
        description: document.getElementById('description').value,
        nominator_name: document.getElementById('nominator_name').value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });
        
        alert('✅ ধন্যবাদ! সফলভাবে মনোনয়ন জমা হয়েছে।');
        this.reset();
        window.location.href = "index.html";
      } catch (error) {
        alert('❌ সার্ভারে কানেক্ট করা যাচ্ছে না!');
      } finally {
        btn.innerText = "জমা দিন";
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
