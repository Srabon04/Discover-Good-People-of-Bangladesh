<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover Good People of Bangladesh</title>
  <style>
    :root {
      --primary-color: #006a4e;
      --secondary-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--secondary-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    /* মূল হেডার ডিজাইন */
    header {
      background: linear-gradient(135deg, #006a4e 0%, #004d38 100%);
      color: white;
      text-align: center;
      padding: 40px 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    header h1 {
      margin: 0 0 10px 0;
      font-size: 32px;
      letter-spacing: 0.5px;
    }

    header p {
      margin: 0;
      opacity: 0.95;
      font-size: 16px;
      font-weight: 300;
    }

    .container {
      max-width: 1050px;
      margin: 30px auto;
      padding: 0 15px;
    }

    /* কাউন্টার স্ট্যাটস */
    .stats-container {
      display: flex;
      justify-content: space-around;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-bottom: 35px;
    }

    .stat-box {
      text-align: center;
    }

    .stat-box h2 {
      margin: 0;
      color: var(--primary-color);
      font-size: 36px;
    }

    .stat-box p {
      margin: 5px 0 0 0;
      color: #666;
      font-size: 14px;
      font-weight: 600;
    }

    .section-title {
      border-bottom: 3px solid var(--primary-color);
      padding-bottom: 8px;
      margin-bottom: 25px;
      font-size: 22px;
      color: var(--primary-color);
      display: inline-block;
    }

    /* কার্ড গ্রিড ও প্রফেশনাল ডিজাইন */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 22px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      border-left: 5px solid var(--primary-color);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .category-badge {
      background-color: #e8f5e9;
      color: var(--primary-color);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .district-tag {
      font-size: 13px;
      color: #666;
      font-weight: 500;
    }

    .card h3 {
      margin: 10px 0 8px 0;
      font-size: 19px;
      color: #1a1a1a;
    }

    .card p {
      margin: 0 0 15px 0;
      font-size: 14px;
      line-height: 1.6;
      color: #555;
      flex-grow: 1;
    }

    .card-footer {
      border-top: 1px solid #f0f0f0;
      padding-top: 12px;
      font-size: 12px;
      color: #888;
    }

    .nominate-btn-wrapper {
      text-align: center;
      margin-top: 40px;
    }

    .btn-nominate {
      background-color: var(--primary-color);
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 15px;
      display: inline-block;
      box-shadow: 0 4px 12px rgba(0,106,78,0.3);
      transition: background 0.2s;
    }

    .btn-nominate:hover {
      background-color: #004d38;
    }
  </style>
</head>
<body>

  <!-- অরিজিনাল সুন্দর হেডার -->
  <header>
    <h1>Discover Good People of Bangladesh</h1>
    <p>জ্ঞান ছড়িয়ে নতুন বানাই, জ্ঞান কাজকে এগিয়ে নিই</p>
  </header>

  <div class="container">
    
    <!-- পরিসংখ্যান -->
    <div class="stats-container">
      <div class="stat-box">
        <h2 id="total-count">০</h2>
        <p>মোট মনোনয়ন</p>
      </div>
      <div class="stat-box">
        <h2>৬৪</h2>
        <p>কভারড জেলা</p>
      </div>
    </div>

    <!-- লাইভ ডাটা সেকশন -->
    <h2 class="section-title">Verified Good People (লাইভ ডাটা)</h2>
    <div id="live-data-container" class="grid-container">
      <p style="text-align:center; grid-column: 1/-1; padding: 30px;">ডাটা লোড হচ্ছে...</p>
    </div>

    <!-- ফর্মে যাওয়ার বাটন -->
    <div class="nominate-btn-wrapper">
      <a href="nominate.html" class="btn-nominate">+ একজন ভালো মানুষকে মনোনয়ন দিন</a>
    </div>

  </div>

  <script>
    // আপনার গুগল অ্যাপস স্ক্রিপ্টের URL (এখানে পেস্ট করুন)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXZNBOzD_eQymyhMjqMbwvAILEel5tJSHa-OXo0bZ_8S8pzbPjuSLWuFSwirogj9GR/exec"; 

    // পেশা বা ক্যাটাগরি অনুযায়ী আইকন ম্যাচ করার ফাংশন
    function getCategoryIcon(cat) {
      if (!cat) return "👤";
      const text = cat.toLowerCase();
      if (text.includes("শিক্ষা") || text.includes("শিক্ষক")) return "🎓";
      if (text.includes("স্বাস্থ্য") || text.includes("ডাক্তার") || text.includes("চিকিৎসা")) return "🩺";
      if (text.includes("সমাজ") || text.includes("সেবা")) return "🤝";
      if (text.includes("কৃষি") || text.includes("কৃষক")) return "🌾";
      if (text.includes("প্রযুক্তি") || text.includes("আইটি")) return "💻";
      if (text.includes("পরিবেশ") || text.includes("গাছ")) return "🌱";
      return "🌟"; // ডিফল্ট আইকন
    }

    async function loadLiveNominations() {
      const container = document.getElementById('live-data-container');
      const countEl = document.getElementById('total-count');

      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        
        if (data && data.results && data.results.length > 0) {
          if (countEl) countEl.innerText = data.results.length;
          container.innerHTML = '';
          
          data.results.forEach(item => {
            const icon = getCategoryIcon(item.category);
            container.innerHTML += `
              <div class="card">
                <div>
                  <div class="card-header">
                    <span class="category-badge">${icon} ${item.category || 'সাধারণ'}</span>
                    <span class="district-tag">📍 ${item.district || 'বাংলাদেশ'}</span>
                  </div>
                  <h3>${item.name}</h3>
                  <p>${item.description}</p>
                </div>
                <div class="card-footer">
                  <span>মনোনয়ন দিয়েছেন: <strong>${item.nominator_name || 'বেনামী'}</strong></span>
                </div>
              </div>
            `;
          });
        } else {
          container.innerHTML = '<p style="text-align:center; grid-column: 1/-1; padding: 30px;">এখনও কোনো তথ্য জমা পড়েনি। প্রথম মনোনয়ন দিন!</p>';
        }
      } catch (err) {
        container.innerHTML = '<p style="text-align:center; color:red; grid-column: 1/-1; padding: 30px;">ডাটা লোড করতে সমস্যা হয়েছে।</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadLiveNominations);
  </script>

</body>
</html>
