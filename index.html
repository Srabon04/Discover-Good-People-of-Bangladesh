<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover Good People of Bangladesh</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    .header { text-align: center; background: #006a4e; color: white; padding: 20px; border-radius: 8px; }
    .stats { display: flex; justify-content: space-around; margin: 20px 0; background: white; padding: 15px; border-radius: 8px; }
    .card { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; border-left: 5px solid #006a4e; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .badge { background: #e8f5e9; color: #006a4e; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
    form { background: white; padding: 20px; border-radius: 8px; margin-top: 20px; }
    input, textarea { width: 100%; padding: 10px; margin: 8px 0 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background: #006a4e; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">
    <h2>Discover Good People of Bangladesh</h2>
    <p>ভালো কাজকে তুলে ধরি, ভালো কাজকে ছড়িয়ে দিই</p>
  </div>

  <div class="stats">
    <div><h3 id="total-count">০</h3><p>মোট মনোনয়ন</p></div>
    <div><h3>৬৪</h3><p>কভারড জেলা</p></div>
  </div>

  <h3>Verified Good People (লাইভ ডাটা)</h3>
  <div id="live-data-container">
    <p style="text-align:center;">ডাটা লোড হচ্ছে...</p>
  </div>

  <hr>

  <h3>একজন ভালো মানুষকে মনোনয়ন দিন</h3>
  <form id="nomination-form">
    <label>মনোনীত ব্যক্তির নাম:</label>
    <input type="text" id="name" placeholder="নাম লিখুন" required>

    <label>ক্যাটাগরি:</label>
    <input type="text" id="category" placeholder="যেমন: শিক্ষা, সমাজসেবা, স্বাস্থ্য" required>

    <label>জেলা:</label>
    <input type="text" id="district" placeholder="জেলার নাম" required>

    <label>ভালো কাজের বিবরণ:</label>
    <textarea id="description" rows="4" placeholder="তার উদ্যোগ ও কাজের বিবরণ লিখুন" required></textarea>

    <label>আপনার নাম (মনোনয়নকারী):</label>
    <input type="text" id="nominator_name" placeholder="আপনার নাম" required>

    <button type="submit">জমা দিন</button>
  </form>

  

</body>
</html>
